<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sam Patterson</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-yellow-50">
    <div class="p-4 flex justify-between">
      <h1 class="typewriter text-2xl font-semibold text-green-950">
        So you want to get to know me.
      </h1>
      <nav class="flex space-x-8 items-center pr-4">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="blog.html">Thoughts</a>
      </nav>
    </div>
    <div>
      <form
        action="mailto:pattersonsam15@gmail.com"
        method="POST"
        enctype="text/plain"
        class="p-8 m-8 bg-green-950 rounded-md lg:w-1/2"
      >
        <label class="block mb-4">
          <span class="text-white">Who are you?(Name)</span>
          <input
            name="name"
            type="text"
            required
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          />
        </label>

        <label class="block mb-4">
          <span class="text-white">Email</span>
          <input
            name="email"
            type="email"
            required
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          />
        </label>

        <label class="block mb-6">
          <span class="text-white">What's up?(Message)</span>
          <textarea
            name="message"
            rows="4"
            required
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          ></textarea>
        </label>

        <button
          type="submit"
          class="w-36 bg-orange-700 text-white py-2 px-4 rounded hover:bg-orange-500 transition-colors"
        >
          Send Message
        </button>
      </form>
    </div>
  </body>
</html>
